name: Release Backend Docker Image

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-alpha.*"
      - "[0-9]*.[0-9]*.[0-9]*-beta.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' is not supported. Expected formats: 0.9.0, 0.9.0-alpha.0, or 0.9.0-beta.0"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
            PUBLISH_LATEST=false
          else
            IS_PRERELEASE=false
            PUBLISH_LATEST=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          TAG_ARGS=(--tag "${IMAGE}:${VERSION}")
          if [[ "${{ steps.meta.outputs.publish_latest }}" == "true" ]]; then
            TAG_ARGS+=(--tag "${IMAGE}:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --push \
            "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.title=keer-backend" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            .

      - name: Publish summary
        shell: bash
        run: |
          echo "Published image tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.meta.outputs.publish_latest }}" == "true" ]]; then
            echo "- \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
